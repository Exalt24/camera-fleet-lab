# A small lab of the problem a camera fleet has: a device at a remote site, behind a router, that the platform
# can only reach through a VPN. Everything runs in Docker on one machine, so the failure modes are real
# Linux behaviour (kernel WireGuard, iptables NAT, conntrack) but the topology is a model, not a deployment.
#
#   hub (platform: FastAPI + WireGuard 10.8.0.1) ---- wan 172.30.0.0/24 ---- edge (site router: WireGuard 10.8.0.2,
#   NAT + firewall) ---- site 10.20.0.0/24 (internal, no route out) ---- camera (RTSP + WebRTC, 10.20.0.10)
#   hub ---- db 10.40.0.0/24 ---- mariadb
#
# The camera sits on a network the hub is NOT on. The only way to it is the tunnel, through a DNAT rule on the edge.
services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: lab-only-password
      MARIADB_DATABASE: fleet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      db:

  camera:
    image: bluenviron/mediamtx:latest-ffmpeg
    volumes:
      - ./camera/mediamtx.yml:/mediamtx.yml:ro
    networks:
      site:
        ipv4_address: 10.20.0.10

  hub:
    build: ./hub
    cap_add: [NET_ADMIN]
    environment:
      DATABASE_URL: mysql+aiomysql://root:lab-only-password@mariadb:3306/fleet
      CAMERA_HOST: 10.8.0.2
      PROBE_INTERVAL_S: "5"
      TRUSTED_PROXY_IP: 172.30.0.30        # the SSO proxy below; its role headers are believed from this address only
    volumes:
      - keys:/keys
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      wan:
        ipv4_address: 172.30.0.10
      db:

  edge:
    build: ./edge
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - keys:/keys
    depends_on:
      - hub
      - camera
    networks:
      wan:
        ipv4_address: 172.30.0.2
      site:
        ipv4_address: 10.20.0.2

  # --- security layer (docker compose --profile security up -d) -----------------------------------------------------
  # Off by default, so `docker compose up` and scripts/verify.py behave exactly as before. See security/README.md.
  wazuh:
    profiles: ["security"]
    image: wazuh/wazuh-manager:4.14.10
    hostname: wazuh
    depends_on:                            # the sensors create the log files Wazuh reads, so they must exist first
      - fw-sensor
      - fleet-exporter
    volumes:
      - secfeed:/feed
      - ./security/wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./security/wazuh/camera_fleet_rules.xml:/wazuh-config-mount/etc/rules/camera_fleet_rules.xml:ro
      - ./security/wazuh/camera_fleet_decoders.xml:/wazuh-config-mount/etc/decoders/camera_fleet_decoders.xml:ro

  fw-sensor:
    profiles: ["security"]
    build: ./security/sensors/fw-sensor
    network_mode: "service:edge"          # shares the site router's network namespace, so edge/ is not modified
    cap_add: [NET_ADMIN]
    volumes:
      - secfeed:/feed
    depends_on:
      - edge

  fleet-exporter:
    profiles: ["security"]
    build: ./security/sensors/fleet-exporter
    environment:
      HUB_URL: http://hub:8000
    volumes:
      - secfeed:/feed
    depends_on:
      - hub
    networks:
      wan:
        ipv4_address: 172.30.0.20          # fixed, so it can never take the edge's 172.30.0.2 at start

  # --- IAM layer (docker compose --profile iam up -d) ----------------------------------------------------------------
  # Off by default. Keycloak and oauth2-proxy put the monitor dashboard behind single sign on with a TOTP code. Run
  # security/iam/setup.sh first: it writes the gitignored security/iam/.env that holds the generated secrets.
  keycloak:
    profiles: ["iam"]
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]          # dev mode, inside Docker only
    env_file:
      - path: security/iam/.env
        required: false
    environment:
      KC_HOSTNAME: http://localhost:8180               # the issuer in every token, whichever address asked for it
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"          # oauth2-proxy reaches it as keycloak:8080 inside the network
    volumes:
      - ./security/iam/realm-camera-fleet.json:/opt/keycloak/data/import/realm-camera-fleet.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      iam:

  oauth2-proxy:
    profiles: ["iam"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    command:
      - --provider=keycloak-oidc
      - --client-id=camera-fleet-dashboard
      - --code-challenge-method=S256
      - --oidc-issuer-url=http://localhost:8180/realms/camera-fleet
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:8180/realms/camera-fleet/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/camera-fleet/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/camera-fleet/protocol/openid-connect/certs
      - --redirect-url=http://127.0.0.1:4180/oauth2/callback
      - --allowed-role=fleet-viewer
      - --allowed-role=fleet-admin
      - --email-domain=*
      - --upstream=http://hub:8000
      - --http-address=0.0.0.0:4180
      - --cookie-secure=false                          # plain http on loopback
      - --cookie-expire=30m
      - --cookie-samesite=lax                          # Strict would break the return from the Keycloak login
      - --cookie-refresh=45s                          # shorter than the 60 s token, so an expired session is renewed or ended
      - --skip-jwt-bearer-tokens=true
      - --oidc-extra-audience=camera-fleet-dashboard
      - --skip-provider-button=true                    # an unauthenticated request is redirected straight to the Keycloak login
      - --pass-user-headers=true
      - --set-xauthrequest=true
      - --reverse-proxy=false
    env_file:
      - path: security/iam/.env
        required: false
    ports:
      - "127.0.0.1:4180:4180"
    depends_on:
      - keycloak
      - hub
    networks:
      iam:
      wan:
        ipv4_address: 172.30.0.30

volumes:
  keys:
  secfeed:

networks:
  wan:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  site:
    internal: true
    ipam:
      config:
        - subnet: 10.20.0.0/24
  db:
    internal: true
    ipam:
      config:
        - subnet: 10.40.0.0/24
  iam:
    ipam:
      config:
        - subnet: 10.50.0.0/24
