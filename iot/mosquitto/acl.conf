# device : the lock simulators. The client id is the lock id, so a lock reads its own command topic and writes its own state only.
user device
pattern read locks/%c/cmd
pattern write locks/%c/state
pattern write locks/%c/status
pattern write locks/%c/event

# vendor and connector: read what the locks say, send commands. They cannot write a lock's state.
user vendor
topic read locks/+/state
topic read locks/+/status
topic read locks/+/event
topic write locks/+/cmd

user connector
topic read locks/+/state
topic read locks/+/status
topic read locks/+/event
topic write locks/+/cmd

# diag: the diagnosis tool reads, may send one harmless report command, and has a topic of its own for the round trip test.
user diag
topic read locks/+/state
topic read locks/+/status
topic write locks/+/cmd
topic readwrite diag/#

# observer: for tests and debugging only. It sees and may send everything under locks/, which no service is given.
user observer
topic readwrite locks/#
topic readwrite diag/#

# doormat: the smart doormat (esp32/): the board or its host emulation. The client id is the doormat id, so a mat reads its own command
# topics and writes its own status and events only.
user doormat
pattern read doormat/%c/cmd/#
pattern write doormat/%c/status
pattern write doormat/%c/event/#

# doormatctl: whoever controls the mats (the control page's broker bridge, a script). It sends commands and reads status and events,
# and it cannot write a mat's status or events.
user doormatctl
topic write doormat/+/cmd/#
topic read doormat/+/status
topic read doormat/+/event/#
