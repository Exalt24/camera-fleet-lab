; Four environments:
;   native      the host unit tests (Unity) of lib/doormat_core, `pio test -e native`
;   core_cli    the same library as a small program that the host emulation and the simulator comparison drive
;   esp32dev    the real firmware for an ESP32 DevKit board (sensors, LEDs, display, I2S audio, Wi-Fi, REST, WebSocket, MQTT, BLE)
;   esp32cam    the camera board (AI Thinker ESP32-CAM): an MJPEG stream
;   esp32qemu   the device logic with scripted peripherals, built to run inside Espressif's QEMU (see qemu/)

[platformio]
src_dir = firmware
default_envs = native

[env]
build_flags = -std=gnu++14 -Wall -Wextra

[env:native]
platform = native
test_framework = unity

[env:core_cli]
platform = native
build_src_filter = -<*> +<../host/core_cli.cpp>

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.embed_txtfiles = web/index.html
build_src_filter = -<*> +<main_device.cpp> +<net.cpp> +<ble.cpp>
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit SSD1306@2.5.10
    links2004/WebSockets@2.6.1
    knolleary/PubSubClient@2.8
    h2zero/NimBLE-Arduino@1.4.2

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
build_src_filter = -<*> +<main_camera.cpp>
monitor_speed = 115200

[env:esp32qemu]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_src_filter = -<*> +<main_qemu.cpp>
monitor_speed = 115200
