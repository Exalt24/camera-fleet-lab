<!--
  Wazuh manager configuration for the camera lab. It starts from the image's default ossec.conf and keeps only what this lab needs:
  the analysis engine, the remote listener (required to start, no agent connects), the three log files the sensors write, the default ruleset (for the stock sshd decoders) and the lab's own
  decoders and rules. File integrity, rootcheck, vulnerability detection, the agent listener and the other modules are switched
  off, because nothing in the lab feeds them and each one would add alerts that are not about the camera site.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <update_check>no</update_check>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <rootcheck><disabled>yes</disabled></rootcheck>
  <syscheck><disabled>yes</disabled></syscheck>
  <sca><enabled>no</enabled></sca>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <wodle name="cis-cat"><disabled>yes</disabled></wodle>
  <wodle name="osquery"><disabled>yes</disabled></wodle>

  <!-- The monitor's state changes, one JSON object per line (written by sensors/fleet_exporter.py). -->
  <localfile>
    <log_format>json</log_format>
    <location>/feed/fleet_transitions.jsonl</location>
    <label key="log_source">fleet-monitor</label>
  </localfile>

  <!-- The site router's dropped packets (written by sensors/fw_sensor.sh). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/feed/edge_firewall.log</location>
  </localfile>

  <!-- A simulated sshd authentication log (written by simulate/ssh_auth_gen.py). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/feed/ssh_auth.log</location>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <auth><disabled>yes</disabled></auth>
  <cluster><name>wazuh</name><node_name>node01</node_name><node_type>master</node_type><key></key><port>1516</port><bind_addr>0.0.0.0</bind_addr><nodes><node>NODE_IP</node></nodes><hidden>no</hidden><disabled>yes</disabled></cluster>
</ossec_config>
